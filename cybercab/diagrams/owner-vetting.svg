<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>How a local owner would be vetted</title>
  <desc>Proposal diagram of the owner record, score, diligence, training, and a separate grant decision.</desc>
  
    <rect width="1920" height="1080" fill="#f4f0e6"/>
    <rect width="1920" height="10" fill="#141816"/>
    <rect y="1036" width="1920" height="44" fill="#141816"/>
    <text x="64" y="56" fill="#14382c" font-family="Inter" font-size="16" font-weight="600" text-anchor="start">PROPOSAL  ·  MUDASIR KHAN</text>
    <text x="64" y="120" fill="#141816" font-family="Liberation Serif" font-size="52" font-weight="700" text-anchor="start">How a local owner is vetted</text>
    <text x="64" y="168" fill="#3a433d" font-family="Inter" font-size="24" font-weight="400" text-anchor="start">A record, a score, diligence, and training. The grant is a later, separate decision.</text>
    <text x="64" y="1064" fill="#f4f0e6" font-family="Inter" font-size="20" font-weight="400" text-anchor="start">Illustrative, not an engineering plan.</text>
  
  
        <rect x="64" y="270" width="345.6" height="720" rx="12" fill="#f4f0e6" stroke="#141816" stroke-width="1.5"/>
        <text x="86" y="310" fill="#14382c" font-family="Inter" font-size="14" font-weight="700" text-anchor="start">01  ·  RECORD</text>
        <text x="86" y="358" fill="#141816" font-family="Liberation Serif" font-size="28" font-weight="700" text-anchor="start">Who would own it</text>
        <text x="86" y="412" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Legal name and entity</text><text x="86" y="446" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">The market they would serve</text><text x="86" y="480" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">First-time majority owner</text><text x="86" y="514" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Operations experience</text><text x="86" y="548" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Working capital, as a range</text><text x="86" y="582" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Agrees: 200 before a second site</text><text x="86" y="616" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Other businesses, if any</text>
      
        <rect x="425.6" y="270" width="345.6" height="720" rx="12" fill="#f4f0e6" stroke="#141816" stroke-width="1.5"/>
        <text x="447.6" y="310" fill="#14382c" font-family="Inter" font-size="14" font-weight="700" text-anchor="start">02  ·  SCORE</text>
        <text x="447.6" y="358" fill="#141816" font-family="Liberation Serif" font-size="28" font-weight="700" text-anchor="start">Then a decision</text>
        <text x="447.6" y="412" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Each line, 1 to 5</text><text x="447.6" y="446" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Counsel may adjust</text><text x="447.6" y="480" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">First-time owner</text><text x="447.6" y="514" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Assigned market</text><text x="447.6" y="548" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Can learn the operation</text><text x="447.6" y="582" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Working capital</text><text x="447.6" y="616" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Background, with counsel</text><text x="447.6" y="650" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Training plan</text><text x="447.6" y="684" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">No guaranteed income</text><text x="447.6" y="718" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Total 35</text><text x="447.6" y="752" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Advance, hold, or decline</text>
      
        <rect x="787.2" y="270" width="345.6" height="720" rx="12" fill="#f4f0e6" stroke="#141816" stroke-width="1.5"/>
        <text x="809.2" y="310" fill="#14382c" font-family="Inter" font-size="14" font-weight="700" text-anchor="start">03  ·  DILIGENCE</text>
        <text x="809.2" y="358" fill="#141816" font-family="Liberation Serif" font-size="28" font-weight="700" text-anchor="start">Before a key</text>
        <text x="809.2" y="412" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Counsel picks the screener</text><text x="809.2" y="446" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Offer, then consent</text><text x="809.2" y="480" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Screen, then a decision</text><text x="809.2" y="514" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Adverse action with counsel</text><text x="809.2" y="548" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">No key before a clear decision</text><text x="809.2" y="582" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Hired to run the yard</text><text x="809.2" y="616" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Not hired to drive</text>
      
        <rect x="1148.8000000000002" y="270" width="345.6" height="720" rx="12" fill="#f4f0e6" stroke="#141816" stroke-width="1.5"/>
        <text x="1170.8000000000002" y="310" fill="#14382c" font-family="Inter" font-size="14" font-weight="700" text-anchor="start">04  ·  TRAINING</text>
        <text x="1170.8000000000002" y="358" fill="#141816" font-family="Liberation Serif" font-size="28" font-weight="700" text-anchor="start">Modules A to G</text>
        <text x="1170.8000000000002" y="412" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">A  Lot safety</text><text x="1170.8000000000002" y="446" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">B  Inspect and photo</text><text x="1170.8000000000002" y="480" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">C  Wash and cabin</text><text x="1170.8000000000002" y="514" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">D  Charging and stalls</text><text x="1170.8000000000002" y="548" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">E  Stage Ready</text><text x="1170.8000000000002" y="582" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">F  Incidents</text><text x="1170.8000000000002" y="616" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">G  Privacy and cameras</text><text x="1170.8000000000002" y="650" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Shadow one open and one close</text><text x="1170.8000000000002" y="684" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Safety miss, then a retest</text><text x="1170.8000000000002" y="718" fill="#3a433d" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Empty-lot drill first</text>
      
        <rect x="1510.4" y="270" width="345.6" height="720" rx="12" fill="#141816" stroke="#141816" stroke-width="1.5"/>
        <text x="1532.4" y="310" fill="#dff56a" font-family="Inter" font-size="14" font-weight="700" text-anchor="start">05  ·  GRANT</text>
        <text x="1532.4" y="358" fill="#f4f0e6" font-family="Liberation Serif" font-size="28" font-weight="700" text-anchor="start">A separate yes</text>
        <text x="1532.4" y="412" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Training is not the grant</text><text x="1532.4" y="446" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Equity, control, and profit</text><text x="1532.4" y="480" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Milestone funding</text><text x="1532.4" y="514" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Not a vehicle loan</text><text x="1532.4" y="548" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Not a guaranteed paycheck</text><text x="1532.4" y="582" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Amount set in a term sheet</text><text x="1532.4" y="616" fill="#f4f0e6" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Counsel before any offer</text>
      
</svg>