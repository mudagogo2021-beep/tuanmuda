<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/tuanmuda/bot-office/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Private live view of Tuan Muda's Grok Bots.">
<title>Bot Office — Tuan Muda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/office.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070b18'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8c35a'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <header class="hud">
      <div class="brand">
        <div class="kicker">TUAN MUDA</div>
        <h1>Bot Office</h1>
        <div class="handle">@youngsirmuda</div>
      </div>
      <div class="hud-right">
        <div class="counts" id="counts" aria-live="polite"></div>
        <button type="button" id="listBtn" aria-expanded="false" aria-controls="listPanel">List</button>
      </div>
    </header>
    <p class="hint" id="hint">Tap a desk for details</p>
    <aside id="listPanel" hidden>
      <div class="list-head">
        <h2>All bots</h2>
        <button type="button" id="listClose">Close</button>
      </div>
      <div id="listBody"></div>
    </aside>
    <section id="card" hidden>
      <button type="button" id="cardClose" aria-label="Close card">×</button>
      <div class="badge" id="cardStatus"></div>
      <h2 id="cardName"></h2>
      <p class="role" id="cardRole"></p>
      <p class="task" id="cardTask"></p>
      <p class="when" id="cardWhen"></p>
    </section>
    <div id="loading">Opening the office…</div>
    <div id="err" hidden></div>
  </div>
  <script type="module" src="js/office.js"></script>
</body>
</html>
